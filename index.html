<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>해홍화 — 쓰는 것들</title>
<meta name="description" content="해홍화가 쓰고 만든 이야기들. THE BLUE IN NANA SE · 꽃도 아닌것이 어찌 그리 고왔던가 · 천사는 인간을 사랑하지 않는다.">
<meta name="theme-color" content="#0A0607">
<meta property="og:type" content="website">
<meta property="og:title" content="해홍화 — 쓰는 것들">
<meta property="og:description" content="꽃도 아닌것이 어찌 그리 고왔던가.">
<meta property="og:image" content="https://feelggim.github.io/assets/cover-hongwha.jpg">
<meta property="og:locale" content="ko_KR">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='4' fill='%23A8102A'/><text x='16' y='24' font-size='21' text-anchor='middle' fill='%23F4ECE9' font-family='serif'>紅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Nanum+Myeongjo:wght@400;700;800&family=Gowun+Batang:wght@400;700&family=IBM+Plex+Mono:wght@300;400&display=swap">
<style>
:root{
  --void:#0A0607;
  --ink:#130C0E;
  --fg:#F1E9E7;
  --dim:#A08E90;
  --faint:#74605F;
  --rule:rgba(241,233,231,.13);
  --hong:#A8102A;
  --hong-lit:#DE4157;
  --gold:#C9A15A;
  --gold-lit:#E4C486;
  --display:"Cormorant Garamond","Nanum Myeongjo",serif;
  --kr:"Nanum Myeongjo",serif;
  --body:"Gowun Batang","Nanum Myeongjo",serif;
  --mono:"IBM Plex Mono",ui-monospace,monospace;
  --gut:clamp(20px,5vw,72px);
}
*{box-sizing:border-box}
html{background:var(--void)}
body{
  margin:0;background:var(--void);color:var(--fg);
  font-family:var(--body);font-size:clamp(15px,.5vw + 13.6px,16.5px);
  line-height:1.95;-webkit-font-smoothing:antialiased;overflow-x:hidden;
}
img{max-width:100%;display:block}
a{color:inherit;text-decoration:none}

/* ── 붉은 기운 ── */
.ember{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ember::before{
  content:"";position:absolute;left:50%;top:-40vh;translate:-50% 0;
  width:150vw;height:92vh;
  background:radial-gradient(ellipse at 50% 62%,
    rgba(222,65,87,.22) 0%,rgba(168,16,42,.12) 26%,rgba(110,12,28,.05) 50%,transparent 74%);
  filter:blur(44px);animation:breathe 17s ease-in-out infinite;
}
.ember::after{
  content:"";position:absolute;left:-12%;bottom:-26vh;width:74vw;height:64vh;
  background:radial-gradient(ellipse at 42% 50%,rgba(168,16,42,.11) 0%,rgba(110,12,28,.04) 44%,transparent 72%);
  filter:blur(56px);animation:breathe 23s ease-in-out infinite reverse;
}
@keyframes breathe{0%,100%{opacity:.78}50%{opacity:1}}

/* ── 기둥 — 화면 양옆에 서 있다 ── */
.pillars{
  position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;
  background:url("assets/pillars.webp") center top / 100% auto no-repeat;
  opacity:.5;
  -webkit-mask-image:linear-gradient(180deg,#000 0%,#000 46%,rgba(0,0,0,.35) 72%,transparent 96%);
  mask-image:linear-gradient(180deg,#000 0%,#000 46%,rgba(0,0,0,.35) 72%,transparent 96%);
}
@media (max-width:900px){.pillars{opacity:.32;background-size:180% auto}}

/* ── 떨어지는 동백 잎 ── */
.petals{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.petal{
  position:absolute;top:-8vh;width:10px;height:14px;
  border-radius:62% 38% 55% 45% / 62% 60% 40% 38%;
  background:linear-gradient(148deg,#E85A70,#A8102A 58%,#68091A);
  box-shadow:inset -1px -2px 3px rgba(0,0,0,.4);
  opacity:0;animation:fall linear infinite;
}
@keyframes fall{
  0%{transform:translate3d(0,-10vh,0) rotate(0deg);opacity:0}
  7%{opacity:1}
  86%{opacity:.8}
  100%{transform:translate3d(var(--dx,50px),112vh,0) rotate(var(--rot,540deg));opacity:0}
}

.wrap{position:relative;z-index:2;max-width:1120px;margin-inline:auto;padding-inline:var(--gut)}

/* ── 현판 ── */
header{padding-block:clamp(40px,7vh,86px) clamp(40px,6vw,76px);text-align:center}
.plaque{position:relative;max-width:min(760px,100%);margin:0 auto}
.plaque img{width:100%;height:auto;filter:drop-shadow(0 22px 54px rgba(0,0,0,.66))}
.plaque__in{
  position:absolute;left:50%;top:50%;translate:-50% -50%;
  width:62%;display:flex;flex-direction:column;align-items:center;gap:6px;
}
.plaque__name{
  font-family:var(--kr);font-weight:800;color:#F6EFEB;
  font-size:clamp(20px,3.8vw,42px);letter-spacing:.34em;text-indent:.34em;line-height:1;
  text-shadow:0 2px 14px rgba(40,2,8,.9),0 0 34px rgba(232,90,112,.5);
}
.plaque__sub{
  font-family:var(--mono);font-size:clamp(7px,.86vw,10px);letter-spacing:.42em;
  text-transform:uppercase;color:var(--gold-lit);text-indent:.42em;
  text-shadow:0 1px 10px rgba(40,2,8,.95);
}
.hanname{
  margin-top:clamp(26px,4vw,44px);
  font-family:var(--kr);font-weight:700;
  font-size:clamp(25px,4.6vw,46px);line-height:1.3;letter-spacing:-.04em;
}
.hanname em{font-style:normal;color:var(--hong-lit)}
.sub{
  margin:1em 0 0;font-family:var(--display);font-style:italic;font-weight:300;
  font-size:clamp(13px,1.5vw,19px);letter-spacing:.14em;color:var(--dim);
}
.count{
  display:flex;align-items:center;gap:14px;margin-top:clamp(36px,5.5vw,64px);
  font-family:var(--mono);font-size:10.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--faint);
}
.count::before,.count::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--rule),transparent)}

/* ── works ── */
.work{display:block;position:relative;margin-top:clamp(30px,4.6vw,58px)}
.work__img{
  position:relative;overflow:hidden;background:var(--ink);
  border:1px solid rgba(168,16,42,.3);
  box-shadow:0 18px 50px rgba(0,0,0,.5);
  transition:border-color .6s ease,box-shadow .6s ease;
}
.work__img img{
  width:100%;aspect-ratio:16/9;object-fit:cover;
  filter:brightness(.84) saturate(1);transform:scale(1.005);
  transition:transform 1.1s cubic-bezier(.16,.8,.28,1),filter .7s ease;
}
.work__img::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(10,6,7,.46) 0%,rgba(10,6,7,.06) 26%,rgba(10,6,7,.5) 58%,rgba(10,6,7,.88) 82%,rgba(10,6,7,.97) 100%);
}
.work__cap{
  position:absolute;left:0;right:0;bottom:0;z-index:2;
  padding:clamp(28px,4.4vw,56px) clamp(20px,3.4vw,44px) clamp(20px,3.2vw,42px);
  background:linear-gradient(180deg,rgba(10,6,7,0) 0%,rgba(10,6,7,.5) 22%,rgba(10,6,7,.82) 58%,rgba(10,6,7,.94) 100%);
}
.work__no{
  display:flex;align-items:center;gap:10px;margin-bottom:12px;
  font-family:var(--mono);font-size:10.5px;letter-spacing:.28em;color:var(--dim);
  text-shadow:0 1px 16px rgba(8,4,5,.98),0 0 30px rgba(8,4,5,.9);
}
.num{
  font-family:var(--kr);font-size:15px;letter-spacing:0;color:#F6EFEB;
  background:var(--hong);border-radius:3px;
  width:24px;height:24px;display:grid;place-items:center;flex:0 0 auto;
  box-shadow:0 0 16px rgba(168,16,42,.55);text-shadow:none;
}
.work__t{
  font-family:var(--kr);font-weight:700;letter-spacing:-.035em;
  font-size:clamp(21px,3.2vw,40px);line-height:1.28;
  text-shadow:0 2px 26px rgba(8,4,5,.96);
}
.work__t .lat{
  display:block;font-family:var(--display);font-style:italic;font-weight:300;
  font-size:.4em;letter-spacing:.16em;color:var(--dim);margin-top:.7em;
}
.work__line{
  margin:.9em 0 0;max-width:46ch;
  font-size:clamp(13.5px,1.25vw,16px);line-height:1.85;color:#DCD1CF;
  text-shadow:0 1px 18px rgba(8,4,5,.96);
}
.work__foot{display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;margin-top:clamp(14px,2vw,22px)}
.tag{
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
  font-family:var(--mono);font-size:10px;letter-spacing:.14em;
  padding:4px 10px;border:1px solid rgba(241,233,231,.22);border-radius:999px;
  color:#D6CAC9;background:rgba(10,6,7,.44);
}
.go{
  text-shadow:0 1px 16px rgba(8,4,5,.98);
  margin-left:auto;font-family:var(--mono);font-size:11px;letter-spacing:.24em;
  text-transform:uppercase;color:var(--fg);
  display:inline-flex;align-items:center;gap:10px;white-space:nowrap;
}
.go span{transition:transform .35s cubic-bezier(.16,.8,.28,1)}

@media (hover:hover){
  .work:hover .work__img img{transform:scale(1.035);filter:brightness(.95) saturate(1.06)}
  .work:hover .work__img{border-color:rgba(222,65,87,.6);box-shadow:0 0 0 1px rgba(168,16,42,.24),0 26px 74px rgba(0,0,0,.66)}
  .work:hover .go span{transform:translateX(7px)}
}
.work:focus-visible{outline:2px solid var(--hong-lit);outline-offset:6px}

/* 본진 — 표지 자체가 제목이다 */
.work--hong .work__t{
  position:absolute;width:1px;height:1px;margin:-1px;padding:0;
  overflow:hidden;clip-path:inset(50%);white-space:nowrap;
}
.work--hong .work__cap{
  background:linear-gradient(180deg,rgba(10,6,7,0) 0%,rgba(10,6,7,.4) 30%,rgba(10,6,7,.8) 66%,rgba(10,6,7,.95) 100%);
}
.work--hong .work__line{margin-top:0}
.work--hong .work__img{border-color:rgba(222,65,87,.45)}
.work--hong .work__img::before{
  content:"본진";position:absolute;right:0;top:0;z-index:3;
  font-family:var(--kr);font-size:11px;letter-spacing:.24em;color:#F6EFEB;
  background:var(--hong);padding:6px 12px;
  box-shadow:0 0 22px rgba(168,16,42,.7);
}

/* ── 낙화 ── */
.fall{
  margin-top:clamp(46px,7vw,86px);
  display:flex;justify-content:center;
}
.fall img{width:clamp(130px,17vw,210px);height:auto;opacity:.9;filter:drop-shadow(0 16px 40px rgba(0,0,0,.6))}

/* ── footer ── */
footer{
  position:relative;
  margin-top:clamp(34px,5vw,58px);padding-block:clamp(38px,6vw,68px);
  border-top:1px solid var(--rule);
  font-family:var(--mono);font-size:10px;letter-spacing:.2em;color:var(--faint);line-height:2.3;
  text-align:center;
}
footer b{font-weight:400;color:var(--fg);font-family:var(--kr);letter-spacing:.14em;font-size:13px}
footer .hanja{color:var(--hong-lit);font-family:var(--kr)}

@media (max-width:640px){
  .work__img img{aspect-ratio:4/3}
  .go{margin-left:0;width:100%}
  .plaque__in{width:70%}
}
@media (prefers-reduced-motion:reduce){
  .ember::before,.ember::after{animation:none}
  .petals{display:none}
  .work__img img,.go span{transition:none}
}
</style>
</head>
<body>

<div class="ember" aria-hidden="true"></div>
<div class="pillars" aria-hidden="true"></div>
<div class="petals" id="petals" aria-hidden="true"></div>

<div class="wrap">

  <header>
    <div class="plaque">
   
      <div class="plaque__in">
        <div class="plaque__name">海紅花</div>
        <div class="plaque__sub">Works</div>
      </div>
    </div>
    <h1 class="hanname">쓰는 것들과<br><em>만드는 것들</em></h1>
    <p class="sub">Stories, and the rooms they live in</p>
    <div class="count">크랙 공개순 &nbsp;·&nbsp; 전체 3편</div>
  </header>

  <main>

    <a class="work work--blue" href="theblue/">
      <figure class="work__img" style="margin:0">
        <img src="assets/cover-theblue.jpg" alt="푸른 물빛 속에서 붓을 든 백발의 인물 — THE BLUE 포스터" style="object-position:50% 26%" loading="eager" decoding="async">
        <figcaption class="work__cap">
          <div class="work__no"><span class="num">壹</span> 현대 판타지 · GL · 백합</div>
          <h2 class="work__t">THE BLUE IN NANA SE<span class="lat">Deep Sea Paintings</span></h2>
          <p class="work__line">바다에서 날 건진 건, 세상에서 제일 유명한 가수였다.</p>
          <div class="work__foot">
            <span class="tag">세이렌</span><span class="tag">GL</span><span class="tag">현대판타지</span><span class="tag">소유</span>
            <span class="go">들어가기 <span aria-hidden="true">→</span></span>
          </div>
        </figcaption>
      </figure>
    </a>

    <a class="work work--hong" href="hongwha/">
      <figure class="work__img" style="margin:0">
        <img src="assets/cover-hongwha.jpg" alt="검은 바탕에 흰 붓글씨로 쓴 제목과 붉은 모란 — 꽃도 아닌것이 어찌 그리 고왔던가" style="object-position:50% 56%" loading="lazy" decoding="async">
        <figcaption class="work__cap">
          <div class="work__no"><span class="num">貳</span> 동양 판타지 · 후회 · 피폐</div>
          <h2 class="work__t">꽃도 아닌것이 어찌 그리 고왔던가<span class="lat">Neither Flower Nor Fair</span></h2>
          <p class="work__line">돌아온 그곳엔, 폭군이 된 그녀와 다른 여자가 있었다.</p>
          <div class="work__foot">
            <span class="tag">홍화국</span><span class="tag">여황제</span><span class="tag">후회</span><span class="tag">혐관</span>
            <span class="go">들어가기 <span aria-hidden="true">→</span></span>
          </div>
        </figcaption>
      </figure>
    </a>

    <a class="work work--naer" href="naer/">
      <figure class="work__img" style="margin:0">
        <img src="assets/cover-naer.jpg" alt="흰 셔츠 차림으로 고개를 들어 아래를 내려다보는 백발의 남자" style="object-position:52% 18%" loading="lazy" decoding="async">
        <figcaption class="work__cap">
          <div class="work__no"><span class="num">參</span> 인외 · 코즈믹 호러 · 앵스트</div>
          <h2 class="work__t">천사는 인간을 사랑하지 않는다<span class="lat">The Angel Does Not Love</span></h2>
          <p class="work__line">현관문은 한 번도 잠긴 적이 없다. 그런데도 당신은 매일 돌아왔다.</p>
          <div class="work__foot">
            <span class="tag">인외</span><span class="tag">사육</span><span class="tag">집착</span><span class="tag">계측</span>
            <span class="go">들어가기 <span aria-hidden="true">→</span></span>
          </div>
        </figcaption>
      </figure>
    </a>

  </main>

  <div class="fall" aria-hidden="true">
    <img src="assets/camellia-fall.webp" alt="" loading="lazy" decoding="async">
  </div>

  <footer>
    <div><b>해홍화</b> &nbsp;<span class="hanja">海紅花</span>&nbsp; · &nbsp;쓰고 그리고 만든다</div>
    <div>All works are original fiction. &nbsp;무단 전재 및 재배포 금지.</div>
  </footer>

</div>

<script>
(function(){
  if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  var host = document.getElementById('petals');
  if (!host) return;
  var n = window.innerWidth < 640 ? 10 : 18;
  for (var i = 0; i < n; i++){
    var p = document.createElement('span');
    p.className = 'petal';
    var size = 6 + Math.random() * 8;
    p.style.left = (Math.random() * 100).toFixed(1) + 'vw';
    p.style.width = size.toFixed(1) + 'px';
    p.style.height = (size * 1.38).toFixed(1) + 'px';
    p.style.setProperty('--dx', ((Math.random() - 0.35) * 170).toFixed(0) + 'px');
    p.style.setProperty('--rot', (260 + Math.random() * 700).toFixed(0) + 'deg');
    p.style.animationDuration = (16 + Math.random() * 20).toFixed(1) + 's';
    p.style.animationDelay = (-Math.random() * 32).toFixed(1) + 's';
    host.appendChild(p);
  }
})();
</script>

</body>
</html>
