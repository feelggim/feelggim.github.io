const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function media(p,cls){
  const fn=p.img.split("/").pop();
  return `<img src="${p.img}" alt="${esc(p.cap)}" loading="lazy" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'tile',innerHTML:'<span class=q>${esc(p.cap).replace(/'/g,"&#39;")}</span><span class=f>${fn}</span>'}))">`;
}
function renderPosts(){
  return `<div class="grid">`+POSTS.map((p,i)=>`<button class="cell" data-i="${i}" aria-label="${esc(p.cap)} 게시물 열기">
    ${media(p)}${p.pin?'<span class="pin">고정됨</span>':''}
    <span class="hover">♥ ${p.likes} &nbsp; 💬 ${p.com.length}</span>
    <span class="back"><span class="t">실제 업로드 ${p.back[0]}</span><span class="n">${esc(p.back[1])}</span></span>
  </button>`).join("")+`</div>`;
}
function renderClips(){
  return `<div class="clip"><div class="grid">`+CLIPS.map(c=>`<div class="cell"><img src="img/${c[0]}.webp" alt="${esc(c[1])}" loading="lazy">
    <span class="clipq">“${esc(c[1])}”</span><span class="cliptag">${esc(c[2])}</span>
    <span class="back"><span class="t">원본 녹화분</span><span class="n">편집 전엔 이 대답 앞에 4초의 침묵이 있었다.</span></span></div>`).join("")+`</div></div>`;
}
function renderPress(){return `<div class="list">`+PRESS.map(p=>`<article class="press"><span class="o">${p[0]}</span><h3>${esc(p[1])}</h3><p>${esc(p[2])}</p></article>`).join("")+`</div>`}
function renderDrafts(){return `<div class="list">`+DRAFTS.map(d=>`<div class="draftItem"><span class="d">${d[0]}</span><p>${esc(d[1])}</p><span class="s">${d[2]}</span></div>`).join("")+`<div class="empty"><b>보관함 0</b><span>숨긴 게시물은 없습니다. 지운 것도 없습니다.</span></div></div>`}
let tab="posts";
function render(){
  const v=$("#view");
  v.innerHTML=tab==="posts"?renderPosts():tab==="clips"?renderClips():tab==="press"?renderPress():renderDrafts();
  document.querySelectorAll(".tab").forEach(b=>b.setAttribute("aria-selected",b.dataset.tab===tab));
  v.querySelectorAll(".cell[data-i]").forEach(b=>b.addEventListener("click",()=>openPost(+b.dataset.i)));
}
function av(u){const c=COLORS[u]||"#6E6478";return u==="parkjueun"?`<img class="av" src="img/jy_avatar.webp" alt="" style="object-fit:cover">`:`<span class="av" style="background:${c}">${u[0].toUpperCase()}</span>`}
let lastFocus=null;
function openPost(i){
  const p=POSTS[i]; lastFocus=document.activeElement;
  $("#mMedia").innerHTML=media(p);
  let html=`<div class="c">${av("parkjueun")}<div><span class="u">parkjueun</span>${esc(p.cap)}<span class="when">${p.date}</span></div></div>`;
  p.com.forEach(([u,t])=>{html+=`<div class="c ${u==="parkjueun"?"reply":""}">${av(u)}<div><span class="u">${u}</span>${esc(t)}</div></div>`});
  html+=`<div class="truth"><span class="t">실제 업로드 ${p.back[0]}</span><span class="n">${esc(p.back[1])}</span></div>`;
  $("#mThread").innerHTML=html;
  $("#mFoot").innerHTML=`<span>좋아요 <b>${p.likes}</b>개</span><span class="date">${p.date}</span>`;
  $("#modal").hidden=false; $("#mClose").focus();
}
function closeModal(){$("#modal").hidden=true; if(lastFocus) lastFocus.focus()}
$("#mClose").addEventListener("click",closeModal);
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal")closeModal()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#modal").hidden)closeModal()});
document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{tab=b.dataset.tab;render()}));
function setFace(f){
  document.documentElement.dataset.face=f;
  $("#faceBtn").setAttribute("aria-pressed",f==="back");
  if(f!=="back"&&tab==="drafts"){tab="posts";render()}
  try{localStorage.setItem("jueun-face",f)}catch(e){}
  muffle(f==="back");
}
/* music: clear on the front, under water on the back */
const bgm=$("#bgm"); let ac=null, lp=null, gn=null;
function initAudio(){
  if(ac) return;
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    const src=ac.createMediaElementSource(bgm);
    lp=ac.createBiquadFilter(); lp.type="lowpass"; lp.Q.value=0.7;
    gn=ac.createGain();
    src.connect(lp).connect(gn).connect(ac.destination);
    muffle(document.documentElement.dataset.face==="back",true);
  }catch(e){ac=null}
}
function muffle(on,now){
  bgm.playbackRate=on?0.94:1; try{bgm.preservesPitch=false}catch(e){}
  if(!ac) return; const t=ac.currentTime, d=now?0.01:1.2;
  lp.frequency.cancelScheduledValues(t); gn.gain.cancelScheduledValues(t);
  lp.frequency.setTargetAtTime(on?700:18000,t,d/3);
  gn.gain.setTargetAtTime(on?0.75:1,t,d/3);
}
$("#musicBtn").addEventListener("click",async e=>{
  const b=e.currentTarget;
  if(bgm.paused){
    initAudio(); try{ if(ac&&ac.state==="suspended") await ac.resume(); await bgm.play(); b.setAttribute("aria-pressed","true"); b.setAttribute("aria-label","배경음악 일시정지"); }catch(err){}
  }else{ bgm.pause(); b.setAttribute("aria-pressed","false"); b.setAttribute("aria-label","배경음악 재생"); }
});
$("#faceBtn").addEventListener("click",()=>setFace(document.documentElement.dataset.face==="back"?"front":"back"));
$("#followBtn").addEventListener("click",e=>{const b=e.currentTarget;const on=b.classList.toggle("primary");b.textContent=on?"팔로우":"팔로잉"});
document.querySelectorAll("[data-story]").forEach(b=>b.addEventListener("click",()=>{
  const k=b.dataset.story; const idx={np:9,ol:5,dg:2,au:3,un:11,cp:0}[k]; openPost(idx);
}));
let saved="front"; try{saved=localStorage.getItem("jueun-face")||"front"}catch(e){}
setFace(saved); render();
