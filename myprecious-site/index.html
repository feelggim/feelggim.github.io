<style>
/* Layout: 한 화면에 고정. 스크롤이 글을 바꾼다. */
:root{
  color-scheme: light;
  --paper:#F3EADA; --paper-2:#EADFCB;
  --ink:#473828; --ink-soft:#6F5B46; --ink-faint:#9A856E;
  --honey:#C08A46; --hair:rgba(71,56,40,.18); --hair-2:rgba(71,56,40,.10);
}
*{box-sizing:border-box}
html, body{height:auto}
html.locked, body.locked{overflow:hidden}
body{
  background:radial-gradient(130% 60% at 50% 0%, #FBF5EA 0%, var(--paper) 45%, var(--paper-2) 100%);
  background-attachment:fixed;
  color:var(--ink);
  font-family:"MP Hangul","Apple SD Gothic Neo",serif; font-weight:300;
  line-height:1.95; letter-spacing:.01em;
}
#dust{position:fixed; inset:0; z-index:60; pointer-events:none}

/* ---------- 표지 ---------- */
.cover{
  position:relative; width:100%; aspect-ratio:1086/1629;
  container-type:inline-size; overflow:hidden; border-radius:2px; background:#F2EADC;
  box-shadow:0 1px 2px rgba(71,56,40,.16), 0 24px 52px -18px rgba(71,56,40,.36);
}
.plate{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block; transition:opacity 2s ease}
.plate.b{opacity:0}
.veil{position:absolute; inset:0; background:linear-gradient(180deg, rgba(255,251,244,.44) 0%, rgba(255,251,244,.17) 34%, rgba(255,251,244,0) 53%)}
.edge{position:absolute; inset:0; box-shadow:inset 0 0 0 1px rgba(71,56,40,.09), inset 0 -80px 100px -80px rgba(71,56,40,.20)}
.lockup{position:absolute; left:0; right:0; top:18.5cqw; display:flex; flex-direction:column; align-items:center; gap:3.1cqw; text-align:center; padding-inline:4cqw}
.lockup .by{margin:0; font-family:"MP Display",Georgia,serif; font-style:italic; font-size:3.15cqw; letter-spacing:.36em; text-indent:.36em; color:#8C7761}
.ttl{display:flex; align-items:baseline; justify-content:center; white-space:nowrap; line-height:1}
.ttl .en{font-family:"MP Display",Georgia,serif; font-size:9.1cqw; color:#473828}
.ttl .sep{font-family:"MP Hangul",serif; font-size:4.8cqw; color:var(--honey); margin-inline:-.9cqw}
.ttl .ko{font-family:"MP Hangul",serif; font-size:5cqw; letter-spacing:.1em; text-indent:.1em; color:#473828}
.lockup .rl{width:10cqw; height:1px; background:rgba(71,56,40,.26)}
.lockup .tg{margin:0; font-size:3.65cqw; letter-spacing:.07em; color:#6F5B46}

/* ---------- 인트로 ---------- */
#gate{
  position:fixed; inset:0; z-index:50; display:flex; flex-direction:column;
  align-items:center; justify-content:center; gap:clamp(20px,4vh,34px); text-align:center;
  padding:calc(env(safe-area-inset-top,0px) + 22px) 20px calc(env(safe-area-inset-bottom,0px) + 22px);
  background:radial-gradient(120% 72% at 50% 42%, #FCF7EE 0%, var(--paper) 48%, var(--paper-2) 100%);
  transition:opacity 1.5s ease, visibility 1.5s;
}
#gate.gone{opacity:0; visibility:hidden; pointer-events:none}
#gate .gin{display:flex; flex-direction:column; align-items:center; gap:clamp(18px,3.6vh,30px); animation:gfade 2s ease both}
@keyframes gfade{from{opacity:0; transform:translateY(12px)} to{opacity:1; transform:none}}
#gate .cover{width:min(290px, 44vh)}
.acts{display:flex; flex-direction:column; align-items:center; gap:13px}
.acts button{
  font-family:"MP Hangul",serif; font-weight:300; font-size:.92rem; letter-spacing:.14em;
  color:var(--ink); background:none; border:1px solid var(--hair); border-radius:999px;
  padding:11px 28px; cursor:pointer; transition:background .5s ease, border-color .5s ease;
}
.acts button:hover{background:rgba(255,252,246,.9); border-color:var(--honey)}
.acts .mute{border:0; padding:4px; font-size:.78rem; letter-spacing:.22em; color:var(--ink-faint)}
.acts .mute:hover{color:var(--ink); background:none}
.acts button:focus-visible, .sp:focus-visible, #snd:focus-visible{outline:2px solid var(--honey); outline-offset:3px}

/* ---------- 본문: 한 화면 고정 ---------- */
#story{position:relative}
.hold{
  position:sticky; top:env(safe-area-inset-top, 0px);
  height:100vh; height:100svh;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:clamp(18px,3vh,30px); padding:clamp(54px,8vh,88px) 20px;
}
.hold::before{content:""; position:absolute; inset:0; pointer-events:none; z-index:-1;
  background:radial-gradient(58% 42% at 50% 50%, rgba(255,252,245,.8) 0%, rgba(255,252,245,0) 72%)}

#slide{width:100%; max-width:600px; display:flex; flex-direction:column; align-items:center;
  gap:clamp(15px,2.6vh,24px); text-align:center;
  opacity:0; transform:translateY(14px);
  transition:opacity .65s ease, transform .75s cubic-bezier(.22,.61,.36,1)}
#slide.show{opacity:1; transform:none}

h2{margin:0; font-weight:300; font-size:.95rem; letter-spacing:.32em; text-indent:.32em; color:var(--ink-faint)}
p{margin:0; font-size:1.02rem; color:var(--ink-soft)}
.lead{font-size:clamp(1.06rem,3.9vw,1.16rem); color:var(--ink); line-height:2.15}
.key{font-size:clamp(1.06rem,4vw,1.16rem); color:var(--ink); line-height:2.05}
.sign{font-family:"MP Display",Georgia,serif; font-style:italic; font-size:.9rem;
  letter-spacing:.34em; text-indent:.34em; color:var(--ink-faint)}
.dot{width:5px; height:5px; border-radius:50%; background:var(--honey); opacity:.55}
#slide .cover{width:min(228px, 31vh)}
.btn{display:inline-block; font-family:"MP Hangul",serif; font-weight:300; font-size:.94rem;
  letter-spacing:.14em; color:var(--ink); text-decoration:none; cursor:pointer;
  background:none; border:1px solid var(--hair); border-radius:999px; padding:12px 30px;
  transition:background .5s ease, border-color .5s ease}
.btn:hover{background:rgba(255,252,246,.92); border-color:var(--honey)}
.btn:focus-visible{outline:2px solid var(--honey); outline-offset:3px}
.prof{width:100%; display:flex; flex-direction:column; gap:12px; align-items:center}
.plabel{font-size:.8rem; letter-spacing:.14em; color:var(--ink-faint)}
#ptext{
  width:100%; margin:0; padding:18px 20px; text-align:left;
  font-family:"MP Hangul",serif; font-weight:300; font-size:.9rem; line-height:1.95;
  color:var(--ink-soft); white-space:pre-wrap; word-break:keep-all;
  border-top:1px solid var(--hair); border-bottom:1px solid var(--hair);
}
#copy{font-family:"MP Hangul",serif; font-weight:300; font-size:.8rem; letter-spacing:.18em;
  color:var(--ink-faint); background:none; border:0; cursor:pointer; padding:6px 4px; transition:color .4s ease}
#copy:hover{color:var(--ink)}
#copy:focus-visible{outline:2px solid var(--honey); outline-offset:3px}

/* 글자 하나씩 */
.reveal:not(.on) .c{opacity:0; filter:blur(5px)}
.reveal .c{transition:opacity 1.1s ease, filter 1.1s ease}

/* 두 개의 숫자 */
.cols{width:100%; display:grid; grid-template-columns:1fr 1fr; border-top:1px solid var(--hair); border-bottom:1px solid var(--hair); text-align:left}
.col{padding:20px 18px; min-width:0}
.col + .col{border-left:1px solid var(--hair-2)}
.col h3{margin:0 0 11px; font-weight:300; font-size:.78rem; letter-spacing:.18em; color:var(--ink-faint)}
.col ul{margin:0; padding:0; list-style:none; display:flex; flex-direction:column; gap:7px}
.col li{font-size:.97rem; color:var(--ink-soft)}
.col.fixed li{color:var(--ink)}
@media (max-width:440px){
  .cols{grid-template-columns:1fr}
  .col + .col{border-left:0; border-top:1px solid var(--hair-2)}
}

/* 네 단계 */
.rows{width:100%; display:flex; flex-direction:column; gap:16px}
.row{display:flex; flex-direction:column; gap:8px}
.row .cap{font-size:.79rem; letter-spacing:.11em; color:var(--ink-faint); line-height:1.85}
.row .say{font-size:clamp(1.04rem,3.9vw,1.2rem); line-height:1.95; letter-spacing:.015em; color:var(--ink)}
.row.past .cap{display:none}
.row.past .say{font-size:.95rem; color:var(--ink-faint)}

/* 종 선택 */
.pick{display:flex; align-items:center; justify-content:center; gap:16px;
  opacity:0; visibility:hidden; transition:opacity .8s ease, visibility .8s}
.pick.on{opacity:1; visibility:visible}
.pick .sp{
  font-family:"MP Hangul",serif; font-weight:300; font-size:.9rem; letter-spacing:.18em;
  color:var(--ink-faint); background:none; border:0; padding:4px 2px; cursor:pointer;
  border-bottom:1px solid transparent; transition:color .6s ease, border-color .6s ease;
}
.pick .sp.sel{color:var(--ink); border-bottom-color:var(--honey)}
.pick .pdiv{width:1px; height:11px; background:var(--hair)}

/* 진행선 */
.thread{position:relative; width:150px; height:1px; background:var(--hair-2)}
.thread b{position:absolute; top:0; left:0; width:100%; height:1px; transform-origin:left center;
  background:linear-gradient(90deg, rgba(192,138,70,.15), rgba(192,138,70,.55));
  transform:scaleX(0); transition:transform .9s cubic-bezier(.22,.61,.36,1)}
.thread span{position:absolute; top:50%; left:0; width:5px; height:5px; margin:-2.5px 0 0 -2.5px;
  border-radius:50%; background:var(--honey); opacity:.75; transition:left .9s cubic-bezier(.22,.61,.36,1)}
.cue{margin:0; font-size:.76rem; letter-spacing:.24em; text-indent:.24em; color:var(--ink-faint); transition:opacity 1s ease}
.cue.off{opacity:0}
#snd{font-family:"MP Hangul",serif; font-weight:300; font-size:.78rem; letter-spacing:.24em;
  color:var(--ink-faint); background:none; border:0; cursor:pointer; padding:6px 4px; transition:color .5s ease}
#snd:hover{color:var(--ink)}
#snd.on{color:var(--honey)}

@media (prefers-reduced-motion:reduce){
  .plate, #slide{transition:none}
  #slide{opacity:1; transform:none}
  .reveal:not(.on) .c{opacity:1; filter:none}
  .reveal .c{transition:none}
  #gate .gin{animation:none}
}
</style>

<script>
jQuery(function($){
  var reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var bgm = document.getElementById('bgm');

  /* ---------- 별가루 ---------- */
  (function(){
    var cv = document.getElementById('dust');
    if (!cv || reduce) return;
    var ctx = cv.getContext('2d');
    var w = 0, h = 0, ps = [];
    var dpr = Math.min(window.devicePixelRatio || 1, 2);

    function mk(y){
      return {
        x: Math.random() * w, y: y,
        r: Math.random() * 2.2 + 0.7,
        v: Math.random() * 0.34 + 0.1,
        sw: Math.random() * 16 + 5,
        ph: Math.random() * 6.2832,
        tw: Math.random() * 0.014 + 0.005,
        a: Math.random() * 0.45 + 0.55
      };
    }
    function resize(){
      w = window.innerWidth; h = window.innerHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      cv.style.width = w + 'px'; cv.style.height = h + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = Math.round(Math.min(320, Math.max(140, w * h / 5200)));
      ps = [];
      for (var i = 0; i < n; i++) ps.push(mk(Math.random() * h));
    }
    function tick(){
      ctx.clearRect(0, 0, w, h);
      ctx.shadowColor = 'rgba(255,255,255,1)';
      for (var i = 0; i < ps.length; i++){
        var p = ps[i];
        p.y += p.v; p.ph += p.tw;
        if (p.y - 8 > h){ ps[i] = mk(-10); continue; }
        var x = p.x + Math.sin(p.ph) * p.sw;
        var a = p.a * (0.6 + 0.4 * Math.sin(p.ph * 1.6));
        ctx.beginPath();
        ctx.arc(x, p.y, p.r, 0, 6.2832);
        ctx.shadowBlur = p.r * 6;
        ctx.fillStyle = 'rgba(255,255,255,' + a.toFixed(3) + ')';
        ctx.fill();
      }
      requestAnimationFrame(tick);
    }
    $(window).on('resize', resize);
    resize();
    requestAnimationFrame(tick);
  })();

  /* ---------- 인트로 ---------- */
  var $gate = $('#gate'), $root = $('html, body');
  if ($gate.length) $root.addClass('locked');
  var $coverTpl = $gate.find('.cover').clone();
  $coverTpl.find('#gtop').removeAttr('id');
  var gi = 0;
  if (!reduce) setInterval(function(){ gi = gi ? 0 : 1; $('.plate.b').css('opacity', gi); }, 5200);

  function enter(withSound){
    if (withSound && bgm){
      bgm.volume = 0.4;
      bgm.play().then(function(){ $('#snd').addClass('on').attr('aria-pressed','true').text('소리 끄기'); })
                .catch(function(){ $('#snd').text('소리를 켤 수 없음'); });
    }
    $gate.addClass('gone');
    $root.removeClass('locked');
    setTimeout(function(){ $gate.remove(); }, 1600);
  }
  $('#enterSnd').on('click', function(){ enter(true); });
  $('#enterMute').on('click', function(){ enter(false); });

  /* ---------- 글자 하나씩 ---------- */
  function type($el, step){
    var text = $el.text();
    $el.empty();
    if (reduce){ $el.text(text); return; }
    var k = 0;
    $.each(text.split(''), function(_, ch){
      if (ch === ' '){ $el.append(document.createTextNode(' ')); return; }
      $el.append($('<span class="c">').text(ch).css('transition-delay', (k * step) + 'ms'));
      k++;
    });
    $el.addClass('reveal');
  }

    {t:'p', h:'같은 문장, 네 번', a:'아이가 문을 보며 하는 말은 끝까지 같습니다.<br>우리가 어떤 모습을 하건, 어떤 형태로 아이를 대하건…<br>흐르는 시간 속에서 느낌표가 하나씩 떨어져 나가고, 끝끝내 버티던 앙칼짐이 그 곁을 내어줄 뿐입니다.'},
    {t:'stage', i:0}, {t:'stage', i:1}, {t:'stage', i:2}, {t:'stage', i:3},
    {t:'p', h:'없는 것', a:'이 이야기엔, 이별도, 무지개다리도, 남은 시간을 세는 문장도 없습니다.<br>수의사는 예후를 말하지 않고, 아무도 마음의 준비를 권하지 않습니다.'},
    {t:'p', a:'마지막 단계에서 흐름은 멈춥니다.<br>새겨진 날짜만 흐르고, 멈춘 자리에서 일상이 계속됩니다.<br>잠이 길어진 아이가 밤에 한 번 일어나 방을 돌고, 이름을 부르면 느리게 돌아오는 날들이.'},
    {t:'key', a:'끝나지 않은 날들을 기억하기 위해 만든 이야기입니다.'},
    {t:'p', h:'이름의 뜻', a:'마이 프레셔스. 가진 것 중에 가장 귀한 것.<br>발치에 앉아, 혹은 소파에 함께 기대어, 혹은 당신의 무릎에서, 당신의 눈높이에 맞추어<br><br>가장 소중한 보물을 담기 위해.'},
    {t:'key', a:'기억 속의 아이를 영원한 보물로 간직하기 위한 이야기입니다.'},
    {t:'end', a:'문을 열면, 아이는 항상, 거기 앉아 있었다.'},
    {t:'join', h:'함께하기'}
  ];

  var N = SLIDES.length;
  var FIRST_STAGE = 6;
  var sp = 'dog', cur = -1;
  var $slide = $('#slide'), $pick = $('#pick'), $cue = $('#cue');
  var story = document.getElementById('story');

  $(story).css('height', ((N + 1) * 100) + 'svh');

  function build(s){
    var $w = $('<div>').css({display:'flex', flexDirection:'column', alignItems:'center',
                             gap:'inherit', width:'100%'});
    var out = [];
    if (s.h) out.push($('<h2>').text(s.h));

    if (s.t === 'lead'){
      out.push($('<p class="lead">').html(s.a));
      out.push($('<p>').html(s.b));
    } else if (s.t === 'p'){
      out.push($('<p>').html(s.a));
    } else if (s.t === 'key'){
      out.push($('<p class="key" data-type>').text(s.a));
    } else if (s.t === 'cols'){
      out.push($(
        '<div class="cols">' +
          '<div class="col"><h3>되돌릴 수 있는 것</h3><ul><li>오늘의 컨디션</li><li>식욕</li><li>곁에 앉는 거리</li></ul></div>' +
          '<div class="col fixed"><h3>되돌릴 수 없는 것</h3><ul><li>나이</li><li>남은 단계</li></ul></div>' +
        '</div>'));
    } else if (s.t === 'stage'){
      var $rows = $('<div class="rows">');
      for (var k = 0; k <= s.i; k++){
        var d = STAGE[sp][k];
        var $r = $('<div class="row">').append(
          $('<div class="cap">').text(d[0] + ' — ' + d[1]),
          $('<div class="say">').text(d[2])
        );
        if (k < s.i){ $r.addClass('past').css('opacity', Math.max(0.2, 0.62 - (s.i - k - 1) * 0.15)); }
        else { $r.find('.say').attr('data-type', ''); }
        $rows.append($r);
      }
      out.push($rows);
    } else if (s.t === 'end'){
      out.push($coverTpl.clone());
      out.push($('<p class="key" data-type>').text(s.a));
      out.push($('<p class="sign">').text('Scroll'));
    } else if (s.t === 'join'){
      if (CRACK) out.push($('<a class="btn" target="_blank" rel="noopener">').attr('href', CRACK).text('크랙에서 함께하기'));
      out.push($('<div class="prof">').append(
        $('<p class="plabel">').text('들어가기 전, 프로필에 적어 주세요'),
        $('<pre id="ptext">').text(PROFILE),
        $('<button id="copy" type="button">').text('프로필 양식 복사')
      ));
      out.push($('<p>').append($('<button id="snd" type="button" aria-pressed="false">').text(
        (bgm && !bgm.paused) ? '소리 끄기' : '소리 켜기'
      ).toggleClass('on', !!(bgm && !bgm.paused))));
    }
    return $w.append(out);
  }

  function show(i){
    var s = SLIDES[i];
    $slide.removeClass('show');
    setTimeout(function(){
      $slide.empty().append(build(s));
      $pick.toggleClass('on', s.t === 'stage');
      $cue.toggleClass('off', i >= N - 1);
      $('.thread b').css('transform', 'scaleX(' + (i / (N - 1)) + ')');
      $('.thread span').css('left', (i / (N - 1) * 100) + '%');
      $slide.find('[data-type]').each(function(){ type($(this), s.t === 'stage' ? 70 : 60); });
      $slide.addClass('show');
      setTimeout(function(){ $slide.find('.reveal').addClass('on'); }, 300);
    }, reduce ? 0 : 520);
  }

  function slideTop(i){
    var total = story.offsetHeight - window.innerHeight;
    return story.offsetTop + (i + 0.5) * (total / N);
  }

  function onScroll(){
    var total = story.offsetHeight - window.innerHeight;
    if (total < 1) total = 1;
    var p = -story.getBoundingClientRect().top / total;
    if (p < 0) p = 0;
    if (p > 0.9999) p = 0.9999;
    var i = Math.floor(p * N);
    if (i > N - 1) i = N - 1;
    if (i !== cur){ cur = i; show(i); }
  }

  // 종을 바꾸면 그 종의 1기부터 다시 본다
  $('.pick .sp').on('click', function(){
    var v = $(this).data('sp');
    if (v === sp) return;
    $('.pick .sp').removeClass('sel');
    $(this).addClass('sel');
    sp = v;
    cur = -1;
    $('html, body').animate({ scrollTop: slideTop(FIRST_STAGE) }, 700);
    setTimeout(onScroll, 60);
  });

  $(window).on('scroll resize', onScroll);
  onScroll();

  /* ---------- 프로필 복사 ---------- */
  $(document).on('click', '#copy', function(){
    var $b = $(this), txt = $('#ptext').text();
    function back(){ setTimeout(function(){ $b.text('프로필 양식 복사'); }, 2000); }
    function pick(){
      var el = document.getElementById('ptext');
      if (el && window.getSelection && document.createRange){
        var r = document.createRange(); r.selectNodeContents(el);
        var s = window.getSelection(); s.removeAllRanges(); s.addRange(r);
      }
      $b.text('직접 복사해 주세요'); back();
    }
    if (navigator.clipboard && navigator.clipboard.writeText){
      navigator.clipboard.writeText(txt).then(function(){ $b.text('복사했습니다'); back(); }).catch(pick);
    } else { pick(); }
  });

  /* ---------- 소리 ---------- */
  $(document).on('click', '#snd', function(){
    var $b = $(this);
    if (!bgm) return;
    if (bgm.paused){
      bgm.volume = 0.4;
      bgm.play().then(function(){ $b.addClass('on').attr('aria-pressed','true').text('소리 끄기'); })
                .catch(function(){ $b.text('소리를 켤 수 없음'); });
    } else {
      bgm.pause();
      $b.removeClass('on').attr('aria-pressed','false').text('소리 켜기');
    }
  });
});
</script>
