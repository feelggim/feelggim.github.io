<style>
/* Layout: a magazine you page through. Desktop shows a two-page spread with real page turns;
   phones show one page at a time with swipe. Every page is a fixed 3:4 sheet whose type scales with the sheet. */
:root{
  --desk:#1A1520; --desk2:#241D2B; --paper:#F7F2EE; --paper2:#EEE6E2; --ink:#15111C; --sub:#6F6474; --rule:rgba(21,17,28,.16);
  --pop:#E0247E; --wine:#8E1238; --pearl:#F3ECF1; --mute:#A79BB2;
  --f-mast:"Unbounded","Noto Sans KR",system-ui,sans-serif;
  --f-head:"Bodoni Moda","Noto Sans KR",Georgia,serif;
  --f-kr:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"DM Mono","Noto Sans KR",ui-monospace,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--desk)}
body{color:var(--pearl);font-family:var(--f-body);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(120% 90% at 50% 40%,var(--desk2),var(--desk) 70%)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
a:focus-visible,button:focus-visible{outline:2px solid var(--pop);outline-offset:3px;border-radius:4px}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 28px;display:grid;gap:14px}

.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;font-family:var(--f-mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.bar b{font-family:var(--f-mast);font-weight:300;letter-spacing:.42em;color:var(--pearl);font-size:13px}
.bar .r{display:flex;gap:10px;align-items:center}
.pill{display:flex;align-items:center;gap:8px;padding:6px 12px;border:1px solid rgba(243,236,241,.16);border-radius:99px;text-transform:none;letter-spacing:.04em;text-decoration:none}
.pill[aria-pressed="true"]{color:var(--pearl);border-color:var(--pop)}
.eq{display:inline-flex;align-items:flex-end;gap:2px;height:11px;width:13px}
.eq i{display:block;width:3px;height:3px;background:var(--pop);border-radius:1px}
.pill[aria-pressed="true"] .eq i{animation:eq 1s ease-in-out infinite}
.pill[aria-pressed="true"] .eq i:nth-child(2){animation-delay:-.4s}
.pill[aria-pressed="true"] .eq i:nth-child(3){animation-delay:-.7s}
@keyframes eq{0%,100%{height:3px}50%{height:11px}}

/* stage */
.stage{position:relative;display:grid;place-items:center;padding-block:6px}
.book{position:relative;width:min(1180px,100%,calc((100vh - 140px) * 1.5));aspect-ratio:3/2;perspective:2600px;transition:transform .9s cubic-bezier(.6,.05,.3,1)}
.book.closed-front{transform:translateX(-25%)}
.book.closed-back{transform:translateX(25%)}
.leaf{position:absolute;top:0;left:50%;width:50%;height:100%;transform-origin:left center;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.6,.05,.3,1)}
.leaf.flipped{transform:rotateY(-180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden;background:var(--paper)}
.face.back{transform:rotateY(180deg)}
.face::after{content:"";position:absolute;inset:0;pointer-events:none}
.face.front::after{background:linear-gradient(90deg,rgba(0,0,0,.18),rgba(0,0,0,0) 7%)}
.face.back::after{background:linear-gradient(270deg,rgba(0,0,0,.18),rgba(0,0,0,0) 7%)}
.book .shadow{position:absolute;inset:2% 0 -3%;border-radius:4px;box-shadow:0 40px 90px rgba(0,0,0,.6);pointer-events:none}

.single{position:relative;width:min(100%,calc((100vh - 150px) * .75));aspect-ratio:3/4;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.55);touch-action:none}
.single .track{display:flex;height:100%;transition:transform .5s cubic-bezier(.6,.05,.3,1)}
.single .sheet{flex:0 0 100%;height:100%;position:relative;overflow:hidden;background:var(--paper)}

.nav{display:flex;justify-content:center;align-items:center;gap:18px;font-family:var(--f-mono);font-size:12px;letter-spacing:.14em;color:var(--mute)}
.nav button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(243,236,241,.18);display:grid;place-items:center;font-size:18px;color:var(--pearl)}
.nav button:disabled{opacity:.25;cursor:default}
.hint{text-align:center;font-family:var(--f-mono);font-size:10.5px;letter-spacing:.12em;color:var(--mute);opacity:.7}

/* ---------- page system (sized by the sheet: 100cqw = page width) ---------- */
.pg{position:absolute;inset:0;container-type:inline-size;color:var(--ink);font-family:var(--f-kr);background:var(--paper);overflow:hidden}
.pg .in{position:absolute;inset:8.4cqw 6.6cqw 8.2cqw;display:flex;flex-direction:column;gap:2.6cqw}
/* running head + folio */
.pg .rh{position:absolute;top:3.4cqw;left:6.6cqw;right:6.6cqw;display:flex;justify-content:space-between;align-items:baseline;padding-bottom:1.1cqw;border-bottom:1px solid var(--rule);font-family:var(--f-mono);font-size:1.35cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);z-index:3}
.pg .rh b{font-family:var(--f-mast);font-weight:400;letter-spacing:.42em;color:var(--ink)}
.pg .fo{position:absolute;bottom:3.2cqw;left:6.6cqw;right:6.6cqw;display:flex;justify-content:space-between;align-items:baseline;font-family:var(--f-mono);font-size:1.35cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--sub);z-index:3}
.pg .fo i{font-family:var(--f-head);font-style:normal;font-size:2.4cqw;letter-spacing:0;color:var(--ink)}
.pg.r .fo{flex-direction:row-reverse}
.pg.dark .rh,.pg.dark .fo,.pg.on-img .rh,.pg.on-img .fo{color:rgba(255,255,255,.72);border-color:rgba(255,255,255,.25)}
.pg.dark .rh b,.pg.dark .fo i,.pg.on-img .rh b,.pg.on-img .fo i{color:#fff}
/* type */
.pg .mono{font-family:var(--f-mono);font-size:1.5cqw;letter-spacing:.22em;text-transform:uppercase;color:var(--sub)}
.pg .kick{font-family:var(--f-mono);font-size:1.5cqw;letter-spacing:.28em;text-transform:uppercase;color:var(--pop);display:flex;align-items:center;gap:1.4cqw}
.pg .kick::before{content:"";width:5cqw;height:1px;background:currentColor}
.pg h2{margin:0;font-family:var(--f-head);font-weight:400;font-size:12cqw;line-height:.9;letter-spacing:-.025em}
.pg h2 em{font-style:italic;color:var(--wine)}
.pg .hk{margin:0;font-family:var(--f-kr);font-weight:800;font-size:4.6cqw;line-height:1.32;letter-spacing:-.02em;word-break:keep-all}
.pg .deck{margin:0;font-family:var(--f-kr);font-size:2.45cqw;line-height:1.75;color:#3A3240;word-break:keep-all}
.pg p{margin:0}
.pg .body{font-size:2.2cqw;line-height:1.82;text-align:justify;word-break:normal;line-break:strict;color:#231C29}
.pg .body p+p{text-indent:1em}
.pg .cols{column-count:2;column-gap:4.2cqw;column-rule:1px solid var(--rule)}
.pg .cols > *{break-inside:avoid-column}
.pg .cols .q,.pg .cols .a{break-inside:auto}
.pg .drop::first-letter{float:left;font-family:var(--f-head);font-size:3.6em;line-height:.82;padding:.08em .1em 0 0;color:var(--wine)}
.pg .q{display:block;margin:1.1em 0 .35em;font-family:var(--f-body);font-weight:600;font-size:2.15cqw;text-align:left;line-height:1.55;color:var(--ink);text-indent:0!important;word-break:keep-all}
.pg .q::before{content:"Q.";margin-right:.45em;font-family:var(--f-head);font-style:italic;font-weight:600;color:var(--pop)}
.pg .q:first-child{margin-top:0}
.pg .a{text-indent:0!important}
.pg .a::before{content:"A.";margin-right:.45em;font-family:var(--f-head);font-style:italic;color:var(--sub)}
.pg .note{font-style:italic;color:#7A6E80}
.pg .pq{margin:1.2em 0;padding:1.6cqw 0;border-top:2px solid var(--ink);border-bottom:1px solid var(--ink);font-family:var(--f-head);font-style:italic;font-size:3.6cqw;line-height:1.15;color:var(--wine);text-align:left;text-indent:0!important;column-span:all;word-break:keep-all}
.pg .pq small{display:block;margin-top:1cqw;font-family:var(--f-kr);font-style:normal;font-size:1.9cqw;color:var(--sub)}
/* images */
.pg .bleed{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.pg .fig{display:block;width:100%;object-fit:cover}
.pg .cap{font-family:var(--f-mono);font-size:1.3cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--sub);line-height:1.5;margin-top:.9cqw}
.pg .cap b{color:var(--pop);font-weight:500}
.pg .shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,8,16,.55),rgba(12,8,16,0) 22%,rgba(12,8,16,0) 45%,rgba(12,8,16,.92) 88%)}
.pg .vcred{position:absolute;right:2.4cqw;top:50%;transform:translateY(-50%) rotate(180deg);writing-mode:vertical-rl;font-family:var(--f-mono);font-size:1.2cqw;letter-spacing:.24em;text-transform:uppercase;color:rgba(255,255,255,.7);z-index:3}
.pg.dark{background:#0E0A14;color:var(--pearl)}
.pg.dark .body{color:rgba(243,236,241,.82)}
.pg.wine{background:#5E0C27;color:#FBEFF4}
/* contents */
.pg .toc{display:grid;gap:0;margin-top:1cqw}
.pg .toc div{display:grid;grid-template-columns:8.5cqw 1fr auto;align-items:baseline;gap:2cqw;padding:.85cqw 0;border-bottom:1px solid rgba(255,255,255,.14)}
.pg .toc b{font-family:var(--f-head);font-weight:400;font-size:4.6cqw;line-height:1;color:#FF5C9E}
.pg .toc span{font-family:var(--f-head);font-size:2.9cqw;line-height:1.1;color:#fff}
.pg .toc small{display:block;margin-top:.5cqw;font-family:var(--f-body);font-size:1.75cqw;color:rgba(243,236,241,.6);letter-spacing:0}
.pg .toc em{font-family:var(--f-mono);font-style:normal;font-size:1.3cqw;letter-spacing:.2em;color:rgba(243,236,241,.45);text-transform:uppercase}
/* masthead box */
.pg .mast{margin-top:auto;border-top:2px solid var(--ink);padding-top:1.6cqw;display:grid;grid-template-columns:1fr 1fr;gap:.9cqw 3cqw;font-family:var(--f-mono);font-size:1.3cqw;letter-spacing:.14em;text-transform:uppercase;color:var(--sub)}
.pg .mast b{display:block;font-family:var(--f-body);font-weight:500;font-size:1.75cqw;letter-spacing:0;text-transform:none;color:var(--ink)}
.pg .sig{font-family:var(--f-head);font-style:italic;font-size:4.4cqw;line-height:1;color:var(--ink)}
.pg .sig small{display:block;margin-top:.8cqw;font-family:var(--f-mono);font-style:normal;font-size:1.3cqw;letter-spacing:.2em;text-transform:uppercase;color:var(--sub)}
/* fact box */
.pg .facts{display:grid;grid-template-columns:repeat(4,1fr);border-top:2px solid var(--ink);border-bottom:1px solid var(--ink)}
.pg .facts div{padding:1.6cqw 1.4cqw;border-left:1px solid var(--rule)}
.pg .facts div:first-child{border-left:0;padding-left:0}
.pg .facts b{display:block;font-family:var(--f-head);font-weight:400;font-size:7cqw;line-height:.95;color:var(--wine)}
.pg .facts span{font-family:var(--f-body);font-size:1.6cqw;line-height:1.4;color:var(--sub)}
/* society grid */
.pg .soc{display:grid;grid-template-columns:1fr 1fr;gap:2.6cqw 2.6cqw;flex:1;min-height:0}
.pg .soc figure{margin:0;display:flex;flex-direction:column;min-height:0}
.pg .soc img{flex:1;min-height:0;width:100%;object-fit:cover}
.pg .soc figcaption{font-family:var(--f-body);font-size:1.6cqw;line-height:1.5;color:#3A3240;margin-top:1cqw;word-break:keep-all}
.pg .soc figcaption b{font-family:var(--f-head);font-style:italic;font-weight:400;font-size:2.4cqw;color:var(--pop);margin-right:.5cqw}
/* her five */
.pg .five{display:grid;gap:2.4cqw;flex:1;min-height:0}
.pg .brand{display:grid;grid-template-columns:auto 1fr;gap:1.2cqw 2.4cqw;align-items:start;padding-top:1.6cqw;border-top:1px solid var(--ink)}
.pg .brand .no{grid-row:span 3;font-family:var(--f-head);font-style:italic;font-size:6.4cqw;line-height:.8;color:var(--pop)}
.pg .bn{font-family:var(--f-mast);font-weight:400;font-size:3.2cqw;letter-spacing:.14em;line-height:1}
.pg .brand .mono{font-size:1.3cqw}
.pg .brand p{font-size:1.95cqw;line-height:1.65;word-break:keep-all;color:#2C2531}
.pg .ph{position:relative;overflow:hidden;background:var(--sw,#2A2033)}
.pg .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pg .ph .swl{position:absolute;left:2cqw;bottom:1.6cqw;font-family:var(--f-mast);font-weight:300;font-size:2.4cqw;letter-spacing:.3em;color:rgba(255,255,255,.85)}
/* making of */
.pg .time{list-style:none;margin:0;padding:0;display:grid}
.pg .time li{display:grid;grid-template-columns:9cqw 1fr;gap:2cqw;align-items:baseline;padding:1.05cqw 0;border-bottom:1px solid var(--rule)}
.pg .time b{font-family:var(--f-head);font-weight:400;font-size:5.4cqw;line-height:.9;color:var(--wine)}

`<div class="pg dark"><img class="bleed" src="${IMG}cover_glitch.webp" alt="MANIAC 표지. 고개를 젖힌 박주은 위로 와인이 쏟아진다" style="object-position:50% 0">${S("예쁘지?",62,58,7,-8,"w")}${S("이날 와인 진짜였음\n머리 3번 감음",76,52,4.2,-5,"w")}</div>`,

/* 1 contents (dark, left) */
`<div class="pg dark">${RH("No.01 · November 2026")}<div class="in" style="gap:0">

    <div><b>05</b><span><span class="x">Interview</span><small>“숨긴 거 없어요. 찾아보세요.”</small></span><em>Talk</em></div>

/* 2 editor's letter (right) */
`<div class="pg r">${RH("Editor’s Letter","<span>From the Editor</span>")}<div class="in">
  <span class="kick">Editor’s Letter</span>
  <p class="hk" style="font-size:5.2cqw">그녀는 모든 질문에<br>질문으로 답했다</p>
  <div class="body cols">
    <p class="drop">11월호를 준비하면서 우리는 한 사람만 생각했다. 사업체 다섯 개, 보라색 머리, 열 손가락의 반지. 이름을 검색하면 사진은 수백 장이 나오는데, 정작 그녀가 어떤 사람인지 말해 주는 문장은 하나도 없었다.</p>
    <p>촬영 날, 그녀는 스태프 열두 명의 이름을 모두 외워 왔다. 조명 감독이 각도를 바꿀 때마다 먼저 웃어 보였고, 와인을 쏟는 컷은 단 한 번에 끝냈다.</p>
    <p>인터뷰는 네 시간 동안 이어졌다. 그녀는 어떤 질문도 피하지 않았다. 대신 모든 질문에 질문으로 답했다. “그게 왜 궁금하세요?” “어디가 문제인데요?”</p>
    <p>녹취를 다시 들으며 알았다. 그녀가 숨긴 건 하나도 없었다. <span class="x">우리가 찾지 못했을 뿐이다.</span> 이번 호는 그 네 시간의 기록이다. 행간은 독자의 몫으로 남긴다.</p>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1.3fr;gap:3cqw;align-items:end">
    <div class="sig">Seoyun Han<small>편집장 한서윤</small></div>

    <span>Styling<b>OFFLINE Hannam</b></span><span>Location<b>ONE LINE, Cheongdam</b></span>
    <span>Music<b>MANIAC</b></span><span>Published by<b>Scroll</b></span>
  </div>
</div>${S("찾을 생각도 없었으면서",50,36,4,-5)}${S("연서진 사진 잘 찍더라\n근데 너무 오래 봄",58,4,3.6,-3)}${FO(2,"Editor’s Letter")}</div>`,

/* 3 opener photo (left) */
`<div class="pg on-img"><img class="bleed" src="${IMG}jy_c03.webp" alt="턱을 괴고 웃는 박주은" style="object-position:47% 30%"><div class="shade"></div>${RH("Cover Story")}
  <span class="vcred">Photographed by 연서진 · Styling OFFLINE Hannam</span>

/* 4 opener type (right) */
`<div class="pg r">${RH("Cover Story","<span>Feature</span>")}<div class="in">

  ${S("숨긴 건 없어.\n안 보이게 안 했을 뿐이지",18,50,4.2,-6)}
  <p class="hk">다섯 개의 브랜드를 가진 여자, 박주은</p>

  <div class="facts" style="margin-top:auto">

/* 5 interview start (left) */
`<div class="pg">${RH("Interview")}<div class="in">
  <span class="kick">Interview</span>
  <p class="hk" style="font-size:5.6cqw">“계획한 적은 없어요.<br>하다 보니까 다<br>돈이 되더라고요.”</p>
  <div class="body cols">
    <p class="drop">약속 시간보다 4분 일찍, 하얀 SUV가 청담동 와인바 앞에 섰다. 운전석 문이 열리자 붉은 가죽 시트가 먼저 보였다. 그녀는 스태프 한 명 한 명에게 먼저 고개를 숙였고, 조명 감독의 이름을 한 번에 외웠다. 촬영이 끝날 무렵, 현장의 모두가 그녀를 “주은 씨”라고 부르고 있었다.</p>
    <p>서른다섯. 사업체 다섯 개. IT 응용소프트웨어 회사 NULLPINK의 이사이자 디자인 에이전시, 편집숍, 와인바, 녹음 스튜디오의 주인. 시작은 그림이었다.</p>
    <span class="q">일러스트레이터에서 IT 회사 이사까지. 자수성가라는 말, 어때요?</span>
    <p class="a">좋아요. 제가 한 건 제가 했다고 말하는 편이라. 그림 그리다가 애들 수학 가르치고, 디자인 회사 차리고, 개발 배워서 CTO 하고. <span class="x">계획한 적은 없어요.</span> 하다 보니까 다 돈이 되더라고요.</p>
    <span class="q">집안 얘기를 묻는 사람도 많을 텐데요.</span>
    <p class="a">그건 방송용이 아니라서요. <span class="note">그녀는 웃으면서 다음 질문을 기다렸다.</span></p>
    <span class="q">처음 번 큰돈으로 뭘 했어요?</span>
    <p class="a">반지 하나 샀어요. 지금 엄지에 있는 거. <span class="note">그녀는 반지를 한 바퀴 돌려 보였다.</span> 제가 저한테 준 첫 선물이에요. 그다음부턴 다 남한테 썼고요.</p>
    <p class="pq">“제가 한 건 제가 했다고<br>말하는 편이라.”</p>
  </div>
</div>${S("엄마 병원비.\n반지는 그다음 달",76,58,3.8,-4)}${S("다 계획했어.\n엄마 아플 때 뭐라도 해야 했거든",10,56,3,-5)}${S("아빠 얘기 꺼내면 끝이야",88,6,4,-3)}${FO(5,"Interview")}</div>`,

/* 6 interview cont. (right) */
`<div class="pg r">${RH("Interview","<span>Park Ju-eun</span>")}<div class="in">
  <div style="display:grid;grid-template-columns:1.15fr 1fr;gap:3cqw;align-items:end">
    <div><img class="fig" src="${IMG}post_desk.webp" alt="와인잔과 치즈, 빼놓은 반지가 놓인 책상" style="aspect-ratio:4/5"><p class="cap"><b>Desk</b> · 와인 한 잔, 치즈, 빼놓은 반지. 그녀의 야근 세팅</p></div>
    <p class="pq" style="margin:0">“예쁜 건 사람들이 사거든요.”<small>다섯 개를 굴리는 비결을 묻자</small></p>
  </div>
  <div class="body cols">
    <span class="q">다섯 개를 굴리는 비결이 있다면.</span>
    <p class="a">예쁜 걸 좋아해요. 그게 다예요. 예쁜 건 사람들이 사거든요. 저는 제가 보기 좋은 것만 만들어요. 안 예쁘면 안 팔리고, 안 팔리면 접어요. 그건 빨리 해요.</p>
    <span class="q">일은 주로 어디서 해요?</span>
    <p class="a">집에서요. 하얀 모니터 두 대, 분홍 키보드, 와인 한 잔, 치즈. 그리고 유니콘 인형. 웃지 마세요. <span class="note">편집부는 웃었다.</span> 일할 땐 아무도 안 건드렸으면 좋겠어요.</p>
    <span class="q">새벽까지 일한다고 들었어요.</span>
    <p class="a">네 시쯤 자요. 수영은 그 전에 하고요. 사람들이 잘 때가 제일 조용하잖아요. 오후 한 시에 일어나서 강아지들 밥 주고, 메일 보고, 미팅 가고, 저녁엔 매장 한 바퀴. 매일 똑같아요.</p>
    <span class="q">포르쉐는 왜 하얀색이에요?</span>
    <p class="a">분홍은 너무 쉽잖아요. 하얀 건 더러워지면 바로 보여요. 그게 좋아요. 숨길 데가 없으니까.</p>
  </div>
</div>${S("3잔째. 치즈는 안 먹었음",9,6,4.2,-6)}${S("유니콘 건들면 죽어\n그 사람만 예외 ♡",87,46,4,-4)}${FO(6,"Interview")}</div>`,

`<div class="pg on-img"><img class="bleed" src="${IMG}jy_c08.webp" alt="평정을 유지하는 박주은" style="object-position:55% 30%"><div class="shade"></div>${RH("Interview")}

/* 8 interview end (right) */
`<div class="pg r">${RH("Interview","<span>Park Ju-eun</span>")}<div class="in">
  <div class="body cols" style="flex:1">
    <span class="q">SNS에 의미심장한 댓글이 많던데요.</span>
    <p class="a">다 보이게 해놨잖아요. 지운 것도 없고요. 어디가 문제인지 한 줄만 짚어 주시면 설명드릴게요. <span class="note">아무도 짚지 못했다.</span></p>
    <span class="q">연애는요?</span>
    <p class="a"><span class="x">다음 질문이요.</span> <span class="note">인터뷰 중 처음으로, 그녀는 대답 대신 와인잔을 들었다.</span></p>
    <p class="pq">“이유는 안 말할래요.”<small>인생곡을 묻자</small></p>
    <span class="q">요즘 가장 좋아하는 건?</span>
    <p class="a">경매요. 사는 것보다 보는 게 좋아요. 누가 얼마까지 버티는지 보이거든요. 그리고 라나 델 레이. 「Young and Beautiful」은 제 인생곡이에요. 이유는 안 말할래요.</p>
    <span class="q">강아지 둘을 키운다고 들었어요.</span>
    <p class="a">가디랑 홍조요. 근데 그건… 얘기가 좀 달라요. <span class="note">그녀는 이 질문에서만 말을 골랐다.</span></p>

    <p class="a">궁금한 거 있으면 물어보세요. 대신 제가 되물어도 화내지 마시고요. <span class="note">그녀는 마지막까지 웃었다.</span></p>

</div>${S("있어. 너네가 알 필요 없을 뿐",23,48,3.6,-4)}${S("늙으면 아무도 안 봐줄까 봐",63,4,3.8,3)}${S("산책은 다 그 사람이 감",74,6,4,-4)}${FO(8,"Interview")}</div>`,

/* 9 under the lights photo (left) */
`<div class="pg on-img"><img class="bleed" src="${IMG}jy_violet.webp" alt="보라색 머리의 박주은 화보 컷" style="object-position:50% 25%"><div class="shade"></div>${RH("Society")}

/* 10 society grid (right) */
`<div class="pg r">${RH("Society","<span>Her November</span>")}<div class="in">

/* 12 partnership Q&A (right) */
`<div class="pg r">${RH("Essay","<span>On Partnership</span>")}<div class="in">
  <div class="body cols" style="flex:1">
    <span class="q">공개 레즈비언 사업가로 산다는 건 어때요?</span>

    <span class="q">파트너십 제도에 대해선요?</span>

    <p class="pq">“한 명이면 돼요.<br>많으면 피곤해요.”</p>
    <span class="q">이상적인 파트너는?</span>
    <p class="a">한 명이면 돼요. 많으면 피곤해요. <span class="note">그녀 주변엔 늘 사람이 많다.</span></p>
    <span class="q">사람들이 왜 당신한테 빠진다고 생각해요?</span>
    <p class="a">제가 예쁜 걸 좋아해서요. 예쁜 사람들은 그걸 알아요. <span class="x">그 이상은 없어요.</span></p>
    <span class="q">질투는 해요?</span>

    <span class="q">싸우면 어떻게 해요?</span>
    <p class="a">안 놔요. 상대가 문 쪽으로 가면 제가 먼저 가서 서 있어요. 그게 제 방식이에요. <span class="note">농담인지 묻자 그녀는 대답하지 않았다.</span></p>

  </div>
</div>${S("한 명. 진짜야.\n아무도 안 믿지만",26,58,3.8,-4)}${S("거짓말. 미칠 것 같음",80,37,4.2,-3)}${FO(12,"On Partnership")}</div>`,

`<div class="pg r">${RH("Life","<span>In Her Bag</span>")}<div class="in">

/* 17 world: traits (left) */
`<div class="pg"><img src="${IMG}lily_cut.webp" alt="" aria-hidden="true" style="position:absolute;top:1cqw;right:-3cqw;width:27cqw;transform:rotate(-14deg);z-index:0;pointer-events:none">${RH("The World of Rainbow")}<div class="in" style="z-index:1">
  <span class="kick">The World of Rainbow · I</span>
  <h2 style="font-size:10.5cqw">형질의 <em>세계</em></h2>
  <p class="deck" style="font-size:2.2cqw">모든 사람은 태어날 때 형질을 갖는다.</p>
  <div class="body cols">
    <p class="drop">이 세계의 사람은 베타, 알파, 오메가로 나뉜다. 열에 아홉은 베타다. 알파와 오메가는 나머지를 나눠 가지고, 그 안에서도 형질이 강하게 발현되는 우성은 극히 드물다. 우성 알파 여성은 0.5%도 되지 않는다.</p>
    <p>우성은 모든 것이 압도적이다. 페로몬이 닿는 범위도, 주기가 몰아치는 세기도, 각인이 남기는 결속도. 우성 오메가의 향은 형질이 없는 베타조차 고개를 돌리게 만든다. 약으로 눌러도, 목에 차단제를 감아도, 아주 조금씩 샌다. 밀폐된 방에 꽂아 둔 백합처럼.</p>
  </div>
  <div class="gloss">
    <div><b>히트<small>HEAT</small></b><p>오메가의 주기. 억제제로 늦출 수 있지만 우성은 완전히 막을 수 없다.</p></div>
    <div><b>러트<small>RUT</small></b><p>알파의 주기. 우성 알파일수록 세고, 참을수록 크게 무너진다.</p></div>
    <div><b>러트 동조<small>SYNC</small></b><p>우성 알파 하나가 러트에 들면 근처 우성 알파도 끌려 들어간다.</p></div>
    <div><b>각인<small>BOND</small></b><p>목덜미에 남기는 결속. 법적으로 혼인에 준하는 효력을 갖는다.</p></div>
    <div><b>다중 각인<small>MULTI</small></b><p>우성 오메가만 가능하다. 각인자끼리는 서로의 감정이 어렴풋이 전해진다.</p></div>
    <div><b>억제제 · 차단제<small>RX</small></b><p>억제제는 주기를, 차단제(초커·패치)는 향을 막는다.</p></div>
  </div>
</div>${S("러트 주간엔\n집 밖에 안 나가",76,6,3.8,-5)}${S("목덜미는\n4년 반 전에",76,56,3.8,4)}${FO(17,"The World of Rainbow")}</div>`,

/* 18 world: the body (right) */
`<div class="pg r">${RH("The World of Rainbow","<span>Rainbow · Melting Down</span>")}<div class="in">
  <span class="kick">The World of Rainbow · II</span>
  <p class="hk" style="font-size:5cqw">여성 알파의 몸.</p>
  <div class="body cols" style="column-count:1">
    <p>이 세계의 여성 알파에게는 난소가 없다. 그 자리를 다른 것이 대신하고 있어서, 여성 알파는 아이를 품지 않는다. 품게 하는 쪽이다. 평소에는 겉으로 드러나지 않지만, 우성 여성 알파의 몸은 오메가를 안을 수 있도록 온전히 자라 있고, 주기나 열기 속에서는 그 차이가 숨길 수 없이 분명해진다. 결속의 순간 쉽게 떨어지지 않는 매듭이 생기는 것도 우성뿐이다. 열성은 그 흔적이 희미하다.</p>
  </div>
  <p class="pq" style="margin:0">“우성 알파의 아이를 볼 수 있는 몸은,<br>우성 오메가뿐이다.”</p>
  <table class="breed">
    <thead><tr><th></th><th>알파<small>ALPHA</small></th><th>베타<small>BETA</small></th><th>오메가<small>OMEGA</small></th></tr></thead>
    <tbody>
      <tr><th>알파<small>ALPHA</small></th><td class="no"><b>×</b>불가</td><td class="rare"><b>△</b>거의 불가</td><td class="ok"><b>○</b>오메가가 품음</td></tr>
      <tr><th>베타<small>BETA</small></th><td class="rare"><b>△</b>거의 불가</td><td class="ok"><b>○</b>보통 사람과 같음</td><td class="rare"><b>△</b>거의 불가</td></tr>
      <tr><th>오메가<small>OMEGA</small></th><td class="ok"><b>○</b>오메가가 품음</td><td class="rare"><b>△</b>거의 불가</td><td class="no"><b>×</b>불가</td></tr>
    </tbody>
  </table>
  <ul class="bnotes">
    <li><b>품는 쪽은 언제나 오메가.</b> 여성 알파는 아이를 품지 않는다.</li>
    <li><b>알파끼리는 불가.</b> 우성 알파 사이에서는 아이가 생기지 않는다.</li>
    <li><b>우성 2세.</b> 우성 오메가뿐. 그래서 우성 오메가는 귀하고, 위험하다.</li>
  </ul>
</div>${S("그래서 다들\n나한테 줄 서",84,56,3.6,-5)}${FO(18,"The World of Rainbow")}</div>`,

const enc=pts=>pts.map(p=>`${Math.round(p[0])},${Math.round(p[1])},${p[2].toFixed(1)}`).join(" ");
const dec=s=>s.split(" ").map(t=>t.split(",").map(Number));
function strokeD(raw){
  const pts=[]; raw.forEach(p=>{const q=pts[pts.length-1]; if(!q||Math.hypot(p[0]-q[0],p[1]-q[1])>1.2) pts.push(p)});
  const n=pts.length; if(!n) return "";
  const P=pts.map((p,i)=>{const a=pts[Math.max(0,i-1)],c=pts[Math.min(n-1,i+1)];
    const taper=Math.min(1,(i+1)/3,(n-i)/3); return [(a[0]+2*p[0]+c[0])/4,(a[1]+2*p[1]+c[1])/4,p[2]*(.55+.45*taper)]});
  if(n<3){const [x,y,w]=P[0],r=Math.max(w/2,1); return `M${x-r} ${y}a${r} ${r} 0 1 0 ${2*r} 0a${r} ${r} 0 1 0 ${-2*r} 0Z`}
  const L=[],R=[];
  P.forEach((p,i)=>{const a=P[Math.max(0,i-1)],c=P[Math.min(n-1,i+1)]; let dx=c[0]-a[0],dy=c[1]-a[1]; const d=Math.hypot(dx,dy)||1; dx/=d;dy/=d;
    const r=p[2]/2; L.push([p[0]-dy*r,p[1]+dx*r]); R.push([p[0]+dy*r,p[1]-dx*r])});

}

    const d=Math.abs(e.deltaY)>Math.abs(e.deltaX)?e.deltaY:e.deltaX; if(Math.abs(d)<12) return;
    e.preventDefault(); const now=Date.now(); if(now<lock) return; lock=now+950; go(d>0?1:-1) },{passive:false});

  let t0=null;
  document.addEventListener("touchstart",e=>{ if(document.getElementById("gate")||(window.__phoneOpen&&__phoneOpen())||e.touches.length>1){t0=null;return} t0=[e.touches[0].clientX,e.touches[0].clientY] },{passive:true});
  document.addEventListener("touchmove",e=>{ if(t0&&!document.getElementById("gate")) e.preventDefault() },{passive:false});
  document.addEventListener("touchend",e=>{ if(!t0) return; const dx=e.changedTouches[0].clientX-t0[0], dy=e.changedTouches[0].clientY-t0[1]; t0=null;
    const d=Math.abs(dy)>Math.abs(dx)?dy:dx; if(Math.abs(d)<40) return; const now=Date.now(); if(now<lock) return; lock=now+500; go(d<0?1:-1) },{passive:true});
})();

<script>
(()=>{
  /* wine flood: a translucent, glowing, sloshing surface rises across the screen on a diagonal */
  const gate=document.getElementById("gate"), cv=document.getElementById("gateWine"); if(!gate||!cv) return;
  const reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
  let started=false;
  const vid=document.getElementById("gateVid");
  new MutationObserver(()=>{ if(!started&&gate.classList.contains("open")){ started=true;
    if(vid&&vid.readyState>=2&&!reduce){ gate.classList.add("vid"); vid.currentTime=0; vid.playbackRate=.95; const p=vid.play(); if(p&&p.catch) p.catch(()=>{ gate.classList.remove("vid"); run() }); reveal(vid) }
    else run() } }).observe(gate,{attributes:true,attributeFilter:["class"]});
  
  /* the wine is a window: wherever it washes over, the magazine underneath shows through and stays */
  function reveal(vid){
    const cv=document.getElementById("gateMask"), c=cv.getContext("2d");
    const dpr=Math.min(devicePixelRatio||1,2), W=innerWidth, H=innerHeight; cv.width=W*dpr; cv.height=H*dpr; c.scale(dpr,dpr);
    const sw=640, sh=360, sc=document.createElement("canvas"); sc.width=sw; sc.height=sh; const sx=sc.getContext("2d",{willReadFrequently:true});
    const mk=document.createElement("canvas"); mk.width=sw; mk.height=sh; const mx=mk.getContext("2d");
    const ov=document.createElement("canvas"); ov.width=sw; ov.height=sh; const ox=ov.getContext("2d");
    const acc=new Float32Array(sw*sh), mImg=mx.createImageData(sw,sh), oImg=ox.createImageData(sw,sh);
    // cover-fit the video into the viewport (scaled a touch, like the css)
    const k=Math.max(W/16,H/9)*1.04, vw=16*k, vh=9*k, vx=(W-vw)/2, vy=(H-vh)/2;
    function bg(){ c.globalCompositeOperation="source-over"; c.fillStyle="#000"; c.fillRect(0,0,W,H);
       [].forEach(([x,y,r,col,a])=>{
        const g=c.createRadialGradient(W*x,H*y,0,W*x,H*y,Math.max(W,H)*r); g.addColorStop(0,"rgba("+col+","+a+")"); g.addColorStop(1,"rgba("+col+",0)"); c.fillStyle=g; c.fillRect(0,0,W,H) }) }
    function frame(){
      if(!document.body.contains(cv)) return;
      sx.drawImage(vid,0,0,sw,sh); const d=sx.getImageData(0,0,sw,sh).data, m=mImg.data, o=oImg.data;
      for(let i=0,p=0;i<acc.length;i++,p+=4){
        const r=d[p], g=d[p+1], b=d[p+2];
        let a=(r-34)/70; a=a<0?0:a>1?1:a; if(r<g*1.25) a*=.35;          // wine-ish pixels only
        if(a>acc[i]) acc[i]=a;
        m[p+3]=acc[i]*255;                                               // revealed so far
        o[p]=Math.min(255,r*1.15); o[p+1]=g*.9; o[p+2]=b*.95; o[p+3]=a*a*170; // the wine itself, glassy
      }
      mx.putImageData(mImg,0,0); ox.putImageData(oImg,0,0);
      bg(); c.globalCompositeOperation="destination-out"; c.filter="blur(10px)"; c.drawImage(mk,vx,vy,vw,vh); c.filter="none";
      c.globalCompositeOperation="source-over"; c.imageSmoothingQuality="high"; c.filter="blur(1.6px)"; c.drawImage(ov,vx,vy,vw,vh); c.filter="none";
      if(!vid.ended) requestAnimationFrame(frame);
    }
    bg(); requestAnimationFrame(frame);
  }
  function run(){
    const dpr=Math.min(devicePixelRatio||1,2), W=innerWidth, H=innerHeight;
    cv.width=W*dpr; cv.height=H*dpr; const c=cv.getContext("2d"); c.scale(dpr,dpr);
    const D=Math.hypot(W,H), N=140, span=D*1.5, dx=span/(N-1);
    const h=new Float32Array(N), v=new Float32Array(N);
    for(let k=0;k<6;k++){ const i=(Math.random()*N)|0; v[i]-=10+Math.random()*8 }
    const bubbles=Array.from({length:46},()=>({x:(Math.random()-.5)*span,d:Math.random()*D*.9+20,r:Math.random()*2.4+.6,s:Math.random()*.6+.4,ph:Math.random()*6}));
    const T=reduce?600:2050, t0=performance.now();
    const ease=x=>x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;
    function bg(){ c.fillStyle="#000"; c.fillRect(0,0,W,H);
       [].forEach(([x,y,r,col,a])=>{
        const g=c.createRadialGradient(W*x,H*y,0,W*x,H*y,Math.max(W,H)*r); g.addColorStop(0,"rgba("+col+","+a+")"); g.addColorStop(1,"rgba("+col+",0)"); c.fillStyle=g; c.fillRect(0,0,W,H) }) }
    function frame(now){
      const t=Math.min(1,(now-t0)/T), sec=(now-t0)/1000;
      // springs
      for(let i=0;i<N;i++){ v[i]+=-0.022*h[i]; v[i]*=0.986; }
      for(let p=0;p<3;p++) for(let i=1;i<N-1;i++){ const l=0.24*(h[i]-h[i-1]), r=0.24*(h[i]-h[i+1]); v[i-1]+=l; v[i+1]+=r }
      for(let i=0;i<N;i++) h[i]+=v[i];
      for(let i=1;i<N-1;i++) h[i]=h[i]*.6+(h[i-1]+h[i+1])*.2;
      if(Math.random()<.2){ const i=1+((Math.random()*(N-2))|0); v[i]-=1.2; v[i-1]-=.8; v[i+1]-=.8 }
      const level=D*.62-ease(t)*D*1.32;                      // surface position, along the tilted axis
      const ang=-0.36+Math.sin(sec*5.2)*0.07*Math.exp(-sec*1.4); // diagonal + decaying slosh
      const amp=46*Math.exp(-sec*.75)+12;
      c.globalCompositeOperation="source-over"; c.clearRect(0,0,W,H); bg();
      c.save(); c.translate(W/2,H/2); c.rotate(ang);
      const Y=i=>level+h[i]+Math.sin(i*.16+sec*3.6)*amp*.35+Math.sin(i*.075-sec*2.6)*amp*.8+Math.sin(i*.031+sec*1.4)*amp*.5;
      const X=i=>-span/2+i*dx;
      const path=(off)=>{ c.moveTo(X(0),Y(0)+off); for(let i=1;i<N-1;i++){ const mx=(X(i)+X(i+1))/2, my=(Y(i)+Y(i+1))/2+off; c.quadraticCurveTo(X(i),Y(i)+off,mx,my) } c.lineTo(X(N-1),Y(N-1)+off) };
      // body
      c.beginPath(); path(0); c.lineTo(span/2,D); c.lineTo(-span/2,D); c.closePath();
      c.globalCompositeOperation="destination-out"; c.fillStyle="#000"; c.fill(); c.globalCompositeOperation="source-over";
      const g=c.createLinearGradient(0,level-30,0,level+D*.9);
      g.addColorStop(0,"rgba(150,8,36,.62)"); g.addColorStop(.05,"rgba(110,4,26,.46)"); g.addColorStop(.22,"rgba(80,0,20,.30)"); g.addColorStop(1,"rgba(40,0,10,.16)");
      c.fillStyle=g; c.fill();
      // light passing through the wine, just under the surface
      c.save(); c.clip(); c.globalCompositeOperation="lighter";
      const lg=c.createRadialGradient(Math.sin(sec*.8)*W*.2,level+60,10,0,level+60,D*.45);
      lg.addColorStop(0,"rgba(255,40,80,.18)"); lg.addColorStop(.5,"rgba(160,10,40,.07)"); lg.addColorStop(1,"rgba(0,0,0,0)");
      c.fillStyle=lg; c.fillRect(-span/2,level-80,span,D*.7);
      // bubbles
      for(const b of bubbles){ const yy=level+b.d-((sec*40*b.s)%b.d); const xx=b.x+Math.sin(sec*2+b.ph)*4;
        c.beginPath(); c.arc(xx,yy,b.r,0,7); c.fillStyle="rgba(255,150,170,"+(.12+.18*(1-(yy-level)/D))+")"; c.fill() }
      c.restore();
      // glowing surface + specular line
      c.beginPath(); path(0);
      c.shadowColor="rgba(255,40,90,.9)"; c.shadowBlur=26; c.strokeStyle="rgba(214,30,70,.85)"; c.lineWidth=3; c.stroke();
      c.shadowBlur=8; c.shadowColor="rgba(255,190,205,.8)"; c.strokeStyle="rgba(255,205,215,.75)"; c.lineWidth=1.1;
      c.beginPath(); path(3); c.stroke();
      c.restore();
      if(t<1||now-t0<T+900) requestAnimationFrame(frame);
    }
    frame(performance.now());
  }
})();
</script>
